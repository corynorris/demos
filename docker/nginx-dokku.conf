# Path-based router for demos.corynorris.me (all-in-one Dokku container).
# Static SPAs are served straight from disk; everything else is proxied to a
# backend listening on 127.0.0.1 (ports remapped to avoid collisions).
# WebSocket upgrades enabled for Socket.IO apps (voting, chat) and Phoenix (trello).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # ── Landing page ──────────────────────────────────
    location = / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Canonicalize app roots so prefix-stripping locations handle them.
    location = /roguelike { return 301 /roguelike/; }
    location = /life { return 301 /life/; }
    location = /recipebox { return 301 /recipebox/; }
    location = /tilemap { return 301 /tilemap/; }
    location = /trello { return 301 /trello/; }
    location = /voting { return 301 /voting/; }
    location = /chat { return 301 /chat/; }
    location = /comments { return 301 /comments/; }
    location = /srs { return 301 /srs/; }

    # ── Static SPAs (served from disk, SPA fallback) ───
    location /roguelike/ {
        alias /usr/share/nginx/html/roguelike/;
        index index.html;
        try_files $uri $uri/ /roguelike/index.html;
    }

    location /life/ {
        alias /usr/share/nginx/html/life/;
        index index.html;
        try_files $uri $uri/ /life/index.html;
    }

    location /recipebox/ {
        alias /usr/share/nginx/html/recipebox/;
        index index.html;
        try_files $uri $uri/ /recipebox/index.html;
    }

    location /tilemap/ {
        alias /usr/share/nginx/html/tilemap/;
        index index.html;
        try_files $uri $uri/ /tilemap/index.html;
    }

    # ── Elixir/Phoenix app ─────────────────────────────
    location ^~ /trello/socket {
        rewrite ^/trello(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /trello/ {
        rewrite ^/trello(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SRS SvelteKit app ──────────────────────────────
    location /srs/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Node.js + Socket.IO apps (WebSocket upgrade) ───
    location ^~ /voting/socket.io {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /voting/ {
        rewrite ^/voting(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location ^~ /chat/socket.io {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /chat/ {
        rewrite ^/chat(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # ── Express apps (standard HTTP) ───────────────────
    location /comments/ {
        rewrite ^/comments(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # URL shortener — matches /s and /s/anything
    location /s {
        rewrite ^/s/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
