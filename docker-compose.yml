# demos.corynorris.me — plain docker compose, deployed by ~/Code/server/up.sh.
#
# Caddy routes demos.corynorris.me to the nginx router service, which strips
# app-specific URL prefixes and proxies internally.
#
# Network model:
#   - internal: intra-stack routing (nginx -> the 10 mini-apps)
#   - edge (external): the router, plus the four services that need the shared
#     Postgres. Postgres is no longer part of this stack; it lives in
#     ~/Code/server/infra/postgres and is reachable on `edge` as `db`.
#
# Every service that joins `edge` needs a globally unique DNS alias — `nginx` is
# far too generic to claim on a network shared with every other stack.

services:
  # ══════════════════════════════════════════════════════════
  # Path-based reverse proxy (joins both networks)
  # ══════════════════════════════════════════════════════════
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.router
    restart: unless-stopped
    networks:
      internal:
      edge:
        aliases: [demos-router]

  # ══════════════════════════════════════════════════════════
  # Static SPAs (Vite → nginx)
  # ══════════════════════════════════════════════════════════
  roguelike:
    build:
      context: ./apps/roguelike
      dockerfile: ../../docker/Dockerfile.static
      args:
        VITE_BASE: /roguelike/
    restart: unless-stopped
    networks:
      - internal

  life:
    build:
      context: ./apps/life
      dockerfile: ../../docker/Dockerfile.static
      args:
        VITE_BASE: /life/
    restart: unless-stopped
    networks:
      - internal

  recipebox:
    build:
      context: ./apps/recipebox
      dockerfile: ../../docker/Dockerfile.static
      args:
        VITE_BASE: /recipebox/
    restart: unless-stopped
    networks:
      - internal

  tilemap:
    build:
      context: ./apps/tilemap
      dockerfile: ../../docker/Dockerfile.static
      args:
        VITE_BASE: /tilemap/
    restart: unless-stopped
    networks:
      - internal

  # ══════════════════════════════════════════════════════════
  # Node.js apps (Express + Socket.IO + React)
  # ══════════════════════════════════════════════════════════
  voting:
    build:
      context: ./apps/voting-app-react
      dockerfile: ../../docker/Dockerfile.voting
      args:
        VITE_BASE: /voting/
        SOCKETIO_PATH: /voting/socket.io
    restart: unless-stopped
    networks:
      - internal

  chat:
    build:
      context: ./apps/socket-io-chat-app
      dockerfile: ../../docker/Dockerfile.chat
      args:
        VITE_BASE: /chat/
        SOCKETIO_PATH: /chat/socket.io
    restart: unless-stopped
    networks:
      - internal

  comments:
    build:
      context: ./apps/react-comment-box
      dockerfile: ../../docker/Dockerfile.comments
      args:
        VITE_BASE: /comments/
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-demos}:${POSTGRES_PASSWORD}@db:5432/comments
    # No depends_on: postgres is a separate compose project now. up.sh brings it
    # up and waits for it to report healthy before deploying any app.
    networks:
      - internal
      - edge

  shortener:
    build:
      context: ./apps/url-shortener
      dockerfile: ../../docker/Dockerfile.shortener
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-demos}:${POSTGRES_PASSWORD}@db:5432/url_shortener
      BASE_URL: ${BASE_URL:-https://demos.corynorris.me/s}
    networks:
      - internal
      - edge

  # ══════════════════════════════════════════════════════════
  # Elixir/Phoenix apps
  # ══════════════════════════════════════════════════════════
  trello:
    build:
      context: ./apps/trello
      dockerfile: ../../docker/Dockerfile.trello
    restart: unless-stopped
    environment:
      SECRET_KEY_BASE: ${TRELLO_SECRET_KEY_BASE}
      SECRET_KEY: ${TRELLO_SECRET_KEY}
      DATABASE_URL: ecto://${POSTGRES_USER:-demos}:${POSTGRES_PASSWORD}@db:5432/trello
      PORT: "4000"
      # Public hostname for URL generation + WebSocket origin checking (check_origin).
      # Must be the real public domain, not the bind address.
      PHX_HOST: ${DOMAIN:-demos.corynorris.me}
      BASE_PATH: "/trello"
    networks:
      - internal
      - edge

  # ══════════════════════════════════════════════════════════
  # Spaced Repetition (SvelteKit)
  # ══════════════════════════════════════════════════════════
  srs:
    build:
      context: ./apps/spaced-repitition
      dockerfile: ../../docker/Dockerfile.srs
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-demos}:${POSTGRES_PASSWORD}@db:5432/spaced_repetition
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-auth-secret-change-me-minimum-32-chars}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://demos.corynorris.me/srs}
      BASE_PATH: /srs
      # LiteLLM gateway. No /v1 suffix — lib/server/services/llm.ts appends
      # /v1/chat/completions itself.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://litellm:4000}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-60000}
      AI_RATE_LIMIT_PER_USER: ${AI_RATE_LIMIT_PER_USER:-5}
      AI_RATE_LIMIT_WINDOW_MS: ${AI_RATE_LIMIT_WINDOW_MS:-60000}
      HOST: "0.0.0.0"
      PORT: "3000"
    networks:
      - internal
      - edge

# Postgres used to live here (`db` + `db-init`). It now runs once for the whole
# box at ~/Code/server/infra/postgres, which owns this stack's five databases
# and the `demos` role. scripts/init-multi-db.sh has been folded into
# infra/postgres/init-databases.sh — the idempotent-on-every-deploy pattern
# came from here.

networks:
  internal:
  edge:
    external: true
