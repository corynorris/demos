# Local development overrides. Auto-merged by `docker compose` on your machine;
# the server deploys with `docker compose -f docker-compose.yml` only.
#
# Postgres moved out of docker-compose.yml into shared infra
# (~/Code/server/infra/postgres). That does not exist on a dev machine, so this
# brings back a local equivalent under the same `db` alias, using this repo's
# own scripts/init-multi-db.sh.
#
# One-time setup on a dev machine — the base compose file expects the shared
# network to already exist:
#
#     docker network create edge

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-demos}"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "5433:5432" # 5433 so it can coexist with portfolio-2027's local db
    networks:
      edge:
        aliases: [db]

  # The router on the host, so http://localhost:8080/<app>/ works locally.
  nginx:
    ports:
      - "8080:80"

volumes:
  postgres_data:
